<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" font-family="Segoe UI, Arial, sans-serif">
  <title>Layered pipe rack, option A: how lines leave the rack, end view and side view</title>
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#993C1D"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1100" height="540" fill="#ffffff"/>

  <text x="60" y="56" font-size="16" fill="#2C2C2A">Leaving the rack (end view, one block)</text>
  <text x="60" y="76" font-size="12" fill="#5F5E5A">Each line turns at mid-block; the four ways out</text>
  <rect x="60" y="110" width="280" height="280" fill="none" stroke="#B4B2A9" stroke-dasharray="5 4"/>
  <g fill="#D3D1C7" stroke="#888780" stroke-width="0.8">
    <rect x="68.75" y="274.1" width="17.5" height="115.9"/><rect x="313.75" y="274.1" width="17.5" height="115.9"/>
    <rect x="68.75" y="274.1" width="262.5" height="17.5"/>
  </g>
  <g stroke="#BA7517" stroke-width="1.2" stroke-dasharray="7 5">
    <line x1="40" y1="162.5" x2="360" y2="162.5"/><line x1="40" y1="337.5" x2="360" y2="337.5"/>
  </g>
  <g fill="#85B7EB" stroke="#185FA5" stroke-width="1.2">
    <circle cx="121.25" cy="250" r="24.1"/><circle cx="173.75" cy="250" r="24.1"/>
    <circle cx="226.25" cy="250" r="24.1"/><circle cx="278.75" cy="250" r="24.1"/>
  </g>
  <g fill="none" stroke="#D85A30" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#e)">
    <path d="M121.25 226 L121.25 88"/>
    <path d="M173.75 226 L173.75 162.5 L362 162.5"/>
    <path d="M302.85 250 L362 250"/>
    <path d="M226.25 274 L226.25 337.5 L38 337.5"/>
  </g>
  <g font-size="13" fill="#042C53" text-anchor="middle" dominant-baseline="central">
    <text x="121.25" y="250">0</text><text x="173.75" y="250">1</text><text x="226.25" y="250">2</text><text x="278.75" y="250">3</text>
  </g>
  <g font-size="14" fill="#993C1D">
    <text x="132" y="96">a</text><text x="376" y="167">b</text><text x="376" y="255">c</text><text x="22" y="342">d</text>
  </g>
  <g font-size="12" fill="#2C2C2A">
    <text x="60" y="424"><tspan fill="#993C1D">a</tspan>  Up or down: straight out of the top or bottom face, at its position.</text>
    <text x="60" y="444"><tspan fill="#993C1D">b</tspan>  Above: rise to the upper crossing level, pass over the tier, leave sideways.</text>
    <text x="60" y="464"><tspan fill="#993C1D">c</tspan>  Flat: only when no lane lies between it and that side in this block.</text>
    <text x="60" y="484"><tspan fill="#993C1D">d</tspan>  Below: drop to the lower crossing level, pass under the tier, leave sideways.</text>
    <text x="60" y="508" fill="#5F5E5A">The beam stands in the bent plane at the block face, clear of the mid-block turns.</text>
  </g>

  <text x="420" y="56" font-size="16" fill="#2C2C2A">Side view along the run (seven blocks)</text>
  <text x="420" y="76" font-size="12" fill="#5F5E5A">Racks placed in line join into one rack</text>
  <g fill="none" stroke="#B4B2A9" stroke-dasharray="5 4">
    <rect x="420" y="140" width="90" height="90"/><rect x="510" y="140" width="90" height="90"/><rect x="600" y="140" width="90" height="90"/>
    <rect x="690" y="140" width="90" height="90"/><rect x="780" y="140" width="90" height="90"/><rect x="870" y="140" width="90" height="90"/>
    <rect x="960" y="140" width="90" height="90"/>
  </g>
  <rect x="420" y="177.26" width="630" height="15.48" fill="#85B7EB" stroke="#185FA5" stroke-width="1"/>
  <g fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.8">
    <rect x="420" y="192.7" width="630" height="2.8"/>
    <rect x="420" y="192.7" width="5.6" height="37.3"/><rect x="690" y="192.7" width="5.6" height="37.3"/>
    <rect x="960" y="192.7" width="5.6" height="37.3"/><rect x="1044.4" y="192.7" width="5.6" height="37.3"/>
  </g>
  <g stroke="#BA7517" stroke-width="1" stroke-dasharray="6 4">
    <line x1="420" y1="156.9" x2="1050" y2="156.9"/><line x1="420" y1="213.1" x2="1050" y2="213.1"/>
  </g>
  <g stroke="#D85A30" stroke-width="7" stroke-linecap="round">
    <line x1="645" y1="177" x2="645" y2="160"/><line x1="825" y1="193" x2="825" y2="210"/>
  </g>
  <g fill="#F0997B" stroke="#993C1D" stroke-width="1.2">
    <circle cx="645" cy="156.9" r="7.7"/><circle cx="825" cy="213.1" r="7.7"/>
  </g>
  <g fill="#993C1D"><circle cx="645" cy="156.9" r="2"/><circle cx="825" cy="213.1" r="2"/></g>
  <line x1="420" y1="250" x2="510" y2="250" stroke="#5F5E5A" marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="465" y="266" font-size="11" fill="#5F5E5A" text-anchor="middle">1 m</text>
  <line x1="690" y1="250" x2="960" y2="250" stroke="#5F5E5A" marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="825" y="266" font-size="11" fill="#5F5E5A" text-anchor="middle">bent every 3rd block</text>
  <g font-size="12" fill="#2C2C2A">
    <text x="420" y="300">Bents (two posts and a beam just beneath the lines) stand at every 3rd block,</text>
    <text x="420" y="318">counted in world coordinates, and at run ends and corners.</text>
    <text x="420" y="338">Stringers tie the posts at the beam level along both post lines in every block,</text>
    <text x="420" y="356">so racks placed in line read as one structure.</text>
    <text x="420" y="376">Between bents the lines span free, as on a real rack.</text>
    <text x="420" y="396">The coral risers leave at mid-block toward the viewer: over the tier in block 3, under it in block 5.</text>
  </g>
</svg>
