<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320">
<style>.t{font:14px sans-serif;fill:#2C2C2A}.ts{font:12px sans-serif;fill:#5F5E5A}.th{font:500 14px sans-serif;fill:#2C2C2A}.box{fill:#F8F7F3;stroke:#B4B2A9}.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-teal{fill:#E1F5EE;stroke:#0F6E56}</style>
<rect width="680" height="320" fill="#fff"/>
<text class="th" x="170" y="46" text-anchor="middle" dominant-baseline="central">Crossing, seen from the side</text>
<rect class="box" x="100" y="70" width="140" height="100" stroke-width="0.5"/><rect class="box" x="100" y="170" width="140" height="100" stroke-width="0.5"/>
<rect class="c-gray" x="100" y="70" width="4" height="200" stroke-width="0.5"/><rect class="c-gray" x="236" y="70" width="4" height="200" stroke-width="0.5"/>
<rect class="c-gray" x="100" y="229" width="140" height="5" stroke-width="0.5"/><rect class="c-gray" x="100" y="129" width="140" height="5" stroke-width="0.5"/>
<rect class="c-teal" x="104" y="215" width="132" height="14" stroke-width="0.5"/>
<circle class="c-teal" cx="131" cy="122" r="7" stroke-width="0.5"/><circle class="c-teal" cx="157" cy="122" r="7" stroke-width="0.5"/><circle class="c-teal" cx="183" cy="122" r="7" stroke-width="0.5"/><circle class="c-teal" cx="209" cy="122" r="7" stroke-width="0.5"/>
<text class="ts" x="250" y="122" dominant-baseline="central">E-W run, upper tier</text>
<text class="ts" x="250" y="222" dominant-baseline="central">N-S run, lower tier</text>
<text class="ts" x="170" y="296" text-anchor="middle" dominant-baseline="central">Runs cross at two heights</text>
<text class="th" x="510" y="46" text-anchor="middle" dominant-baseline="central">Two-wide turn, from above</text>
<g stroke-width="0.5"><rect class="box" x="510" y="170" width="40" height="40"/><rect class="box" x="550" y="170" width="40" height="40"/><rect class="box" x="510" y="210" width="40" height="40"/><rect class="box" x="550" y="210" width="40" height="40"/></g>
<g class="c-gray" stroke-width="0.5"><rect x="430" y="130" width="40" height="40"/><rect x="430" y="170" width="40" height="40"/><rect x="430" y="210" width="40" height="40"/><rect x="470" y="170" width="40" height="40"/><rect x="470" y="210" width="40" height="40"/><rect x="470" y="90" width="40" height="40"/><rect x="510" y="90" width="40" height="40"/><rect x="550" y="90" width="40" height="40"/><rect x="510" y="130" width="40" height="40"/><rect x="550" y="130" width="40" height="40"/></g>
<rect class="c-teal" x="430" y="90" width="40" height="40" stroke-width="1"/><rect class="c-teal" x="470" y="130" width="40" height="40" stroke-width="1"/>
<g stroke="#888780" stroke-width="4"><line x1="450" y1="130" x2="450" y2="250"/><line x1="490" y1="170" x2="490" y2="250"/><line x1="470" y1="110" x2="590" y2="110"/><line x1="510" y1="150" x2="590" y2="150"/></g>
<g fill="none" stroke="#1D9E75" stroke-width="4" stroke-linejoin="round"><path d="M450 130 L450 110 L470 110"/><path d="M490 170 L490 150 L510 150"/></g>
<text class="ts" x="510" y="296" text-anchor="middle" dominant-baseline="central">Each run turns at its own corner</text>
</svg>
