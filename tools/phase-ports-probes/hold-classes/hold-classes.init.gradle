// Attaches this folder's src/ (and ../hold-fuzz/src/, the fuzz world and its class reproductions) to the test source set
// for one Gradle invocation, and forwards the fuzz switches:
//   ./gradlew --no-configuration-cache --init-script tools/phase-ports-probes/hold-classes/hold-classes.init.gradle test --tests '*E3ProbeTest'
// Not part of any gate suite: without this init script nothing here is compiled.
gradle.projectsEvaluated {
    def here = gradle.startParameter.initScripts.find { it.name == 'hold-classes.init.gradle' }.parentFile
    def root = gradle.rootProject
    root.sourceSets.test.java.srcDir(new File(here, 'src'))
    root.sourceSets.test.java.srcDir(new File(here, '../hold-fuzz/src'))
    // E6RowScaleProbeTest compiles only with src/scratch-e6-donor-tol-counters.patch applied: -Pe6probe=true attaches it.
    if (!root.findProperty('e6probe')) root.sourceSets.test.java.exclude '**/E6RowScaleProbeTest.java'
    root.tasks.withType(Test).configureEach {
        maxHeapSize = '8g'
        systemProperty 'holdFuzz.seeds', root.findProperty('holdFuzzSeeds') ?: '1-20'
        systemProperty 'holdFuzz.threads', root.findProperty('holdFuzzThreads') ?: '8'
        systemProperty 'holdFuzz.slices', root.findProperty('holdFuzzSlices') ?: '120'
        systemProperty 'holdFuzz.verbose', root.findProperty('holdFuzzVerbose') ?: 'false'
        systemProperty 'holdFuzz.defaults', root.findProperty('holdFuzzDefaults') ?: 'false'
        systemProperty 'holdFuzz.counters', root.findProperty('holdFuzzCounters') ?: 'false'
        systemProperty 'holdFuzz.pipeBetween', root.findProperty('holdFuzzPipeBetween') ?: 'true'
        systemProperty 'instr', root.findProperty('instr') ?: ''
        ['mint','estimate','filterclose','capscale','capscale2','e6donor','e6tol','e6states','e6counters','e6grid','e6interval','e6spread','e6slice','e6count','e6uncapped','e6minone','e6step'].each { k -> def v = root.findProperty(k); if (v != null) systemProperty k, v }
        ['seed','keep','holds'].each { k -> def v = root.findProperty('replay' + k.capitalize()); if (v != null) systemProperty 'replay.' + k, v }
        ['seeds','cards'].each { k -> def v = root.findProperty('probe' + k.capitalize()); if (v != null) systemProperty 'probe.' + k, v }
        ['seed','defaults','class','slices','match','threads'].each { k -> def v = root.findProperty('minimize' + k.capitalize()); if (v != null) systemProperty 'minimize.' + k, v }
        testLogging { showStandardStreams = true }
        outputs.upToDateWhen { false }
    }
}
