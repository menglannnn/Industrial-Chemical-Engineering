// Attaches src-t7/ (the t7 junction-start probes, 2026-10-12), src/ without the E6 probe (which needs its scratch patch) and
// ../hold-fuzz/src/ to the test source set for one Gradle invocation, and forwards the fuzz, minimizer and t7* switches.
// Not part of any gate suite: without this init script nothing here is compiled.
//   ./gradlew --no-configuration-cache --init-script tools/phase-ports-probes/hold-classes/t7.init.gradle test --tests '*T7StartProbeTest' -Pt7world=tank
gradle.projectsEvaluated {
    def here = gradle.startParameter.initScripts.find { it.name == 't7.init.gradle' }.parentFile
    def root = gradle.rootProject
    root.sourceSets.test.java.srcDir(new File(here, 'src'))
    root.sourceSets.test.java.srcDir(new File(here, '../hold-fuzz/src'))
    root.sourceSets.test.java.srcDir(new File(here, 'src-t7'))
    root.sourceSets.test.java.exclude('**/E6RowScaleProbeTest.java')
    root.tasks.withType(Test).configureEach {
        maxHeapSize = '8g'
        systemProperty 'holdFuzz.seeds', root.findProperty('holdFuzzSeeds') ?: '1-20'
        systemProperty 'holdFuzz.threads', root.findProperty('holdFuzzThreads') ?: '8'
        systemProperty 'holdFuzz.slices', root.findProperty('holdFuzzSlices') ?: '120'
        systemProperty 'holdFuzz.verbose', root.findProperty('holdFuzzVerbose') ?: 'false'
        systemProperty 'holdFuzz.defaults', root.findProperty('holdFuzzDefaults') ?: 'false'
        systemProperty 'holdFuzz.pipeBetween', root.findProperty('holdFuzzPipeBetween') ?: 'true'
        systemProperty 'holdFuzz.out', root.findProperty('holdFuzzOut') ?: new File(here, 'logs/report.txt').absolutePath
        ['holdFuzz.wallNanos','holdFuzz.softNanos','instr'].each { k -> def v = root.findProperty(k); if (v != null) systemProperty k, v }
        ['seed','keep','holds'].each { k -> def v = root.findProperty('replay' + k.capitalize()); if (v != null) systemProperty 'replay.' + k, v }
        ['seed','defaults','class','slices','match','threads'].each { k -> def v = root.findProperty('minimize' + k.capitalize()); if (v != null) systemProperty 'minimize.' + k, v }
        root.properties.findAll { it.key.startsWith('t7') }.each { k, v -> systemProperty k, v }
        testLogging { showStandardStreams = true }
        outputs.upToDateWhen { false }
    }
}
