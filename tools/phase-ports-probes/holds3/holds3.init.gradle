// Attaches this folder's src/ (and, with -Pholds3Instr, instr/, which needs instr/instr-f8-singular-dump.patch applied)
// to the test source set for one Gradle invocation:
//   ./gradlew --init-script tools/phase-ports-probes/holds3/holds3.init.gradle test --tests '*InlineFilterLineHoldTest'
gradle.projectsEvaluated {
    def here = gradle.startParameter.initScripts.find { it.name == 'holds3.init.gradle' }.parentFile
    gradle.rootProject.sourceSets.test.java.srcDir(new File(here, 'src'))
    if (gradle.rootProject.findProperty('holds3Instr')) gradle.rootProject.sourceSets.test.java.srcDir(new File(here, 'instr'))
    gradle.rootProject.tasks.withType(Test).configureEach {
        testLogging { showStandardStreams = true }
        outputs.upToDateWhen { false }
    }
}
